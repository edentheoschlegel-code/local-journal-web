<!-- ONE theme-color tag, kept in step with data-theme by theme-boot.js, as on the
     app page: media-gated tags cannot follow a manual in-app override. The
     script is referenced from the site root because this page is served for any
     path, so a relative src would miss from a deep URL. -->
<meta name="theme-color" id="themeColorMeta" content="#fffdfb">
<script src="/theme-boot.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#f8f1f6,#fffdfb);color:#1e1c25;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{max-width:460px}.n{font-size:96px;font-weight:900;letter-spacing:-3px;color:#7b3f6b;line-height:1}
  h1{font-size:26px;font-weight:800;margin:14px 0 8px}p{color:#504c58;font-size:16px;line-height:1.5;margin-bottom:26px}

  a.btn:hover{filter:brightness(1.06)}
  :root{color-scheme:light dark}
  :root[data-theme="light"]{color-scheme:light}
  :root[data-theme="dark"]{color-scheme:dark}
  /* Dark mode follows the theme chosen in the app (theme-boot.js sets data-theme
     before paint); the media block is the fallback for when that script cannot
     run, scoped to :root:not([data-theme]) so it never fights an explicit
     choice. Tokens mirror privacy.html and support.html so arriving from the app
     is not a jump in brightness. */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]) body{background:linear-gradient(160deg,#1e1c24,#17161a);color:#e6e4ea}
    :root:not([data-theme]) .n{color:#d69fc4}
    :root:not([data-theme]) p{color:#c8c4cf}
  }
  [data-theme="dark"] body{background:linear-gradient(160deg,#1e1c24,#17161a);color:#e6e4ea}
  [data-theme="dark"] .n{color:#d69fc4}
  [data-theme="dark"] p{color:#c8c4cf}</style></head><body><div class="box"><div class="n">404</div><h1>This page wandered off</h1><p>The page you're looking for isn't here — but your journal is exactly where you left it, on your device.</p><a class="btn" href="/">Go to Local Journal</a></div></body></html>

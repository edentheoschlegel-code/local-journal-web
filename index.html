<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- The app loads nothing from another host, so this policy names none:
       'self' only, everywhere. That is what makes the on-device promise
       browser-enforced rather than a claim. (Same-origin requests do happen
       after load — the service worker, and the PDF engine on first export.)
       It is also why the theme script is an external file — inline script is
       blocked. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Local Journal — A Private Journal on Your Device</title>
  <meta name="description" content="Write and keep a journal right on your device. Entries are stored in your browser on this device — no account, no sync, and no analytics or advertising code in the app.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="canonical" href="https://localjournalapp.com/">
  <!-- ONE theme-color tag, kept in step with data-theme by theme-boot.js and
       app.js. Two media-gated tags cannot follow a manual in-app override, so a
       user on a light OS who picks dark in-app gets a white bar above a dark
       page. The value is the topbar surface (mulberry's warm near-white /
       near-black), not the accent — the browser bar sits directly above the
       topbar and has to match it. The mulberry accent itself is the manifest's
       theme_color. -->
  <meta name="theme-color" id="themeColorMeta" content="#fffdfb">
  <link rel="manifest" href="assets/manifest.webmanifest">
  <!-- Open Graph / social share -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Local Journal">
  <meta property="og:url" content="https://localjournalapp.com/">
  <meta property="og:title" content="Local Journal — Your journal, right on your device">
  <meta property="og:description" content="Write and keep a journal right on your device. Entries are stored in your browser on this device — no account, no sync, and no analytics or advertising code in the app.">
  <meta property="og:image" content="https://localjournalapp.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Local Journal — private, on your device">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Local Journal — Your journal, right on your device">
  <meta name="twitter:description" content="Write and keep a journal right on your device. Entries are stored in your browser on this device — no account, no sync, and no analytics or advertising code in the app.">
  <meta name="twitter:image" content="https://localjournalapp.com/assets/og-image.png">
  <!-- Sets data-theme before first paint (no light→dark flash). External file
       so it satisfies the strict CSP's script-src 'self'. -->
  <script src="theme-boot.js?v=cb8e448e7d"></script>
  <link rel="stylesheet" href="styles.css?v=cb8e448e7d">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Local Journal","url":"https://localjournalapp.com/","description":"Write and keep a journal right on your device. Entries are stored in your browser on this device — no account, no sync, and no analytics or advertising code in the app.","applicationCategory":"LifestyleApplication","operatingSystem":"Web, iOS","isAccessibleForFree":true,"browserRequirements":"Requires JavaScript. Runs in your browser on your device — no account, no sync.","publisher":{"@type":"Organization","name":"Local Journal"}}</script>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to content</a>

  <!-- Slim banner slot — storage trouble and lock notices land here. Calm,
       never red unless something is actually failing right now. -->
  <div id="topBanner" class="top-banner" hidden></div>

  <div class="topbar">
    <a class="logo" id="logo" href="#/write" aria-label="Local Journal — go to the editor">
      <img src="assets/brand-icon-512.png" alt="" width="30" height="30" aria-hidden="true">
      <b>Local <span class="wm-accent">Journal</span></b>
    </a>
    <div class="topbar-right">
      <span class="privacy-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <span class="pill-long">Private by design</span>
        <span class="pill-short">Private</span>
      </span>
      <button type="button" id="lockNowBtn" class="theme-toggle hidden" title="Lock the journal" aria-label="Lock the journal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </button>
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch theme"></button>
    </div>
  </div>

  <div class="shell">
    <aside class="sidebar" aria-label="Sections">
      <nav class="side-nav" id="sideNav" aria-label="Main">
        <a class="nav-item" href="#/write" data-route="write">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          Write
        </a>
        <a class="nav-item" href="#/entries" data-route="entries">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Entries
        </a>
        <a class="nav-item" href="#/calendar" data-route="calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Calendar
        </a>
        <a class="nav-item" href="#/settings" data-route="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Backup &amp; lock
        </a>
      </nav>
      <!-- sidebar privacy card removed 2026-08-08 (Eden: privacy was overly repeated) —
           the topbar pill carries the promise; privacy.html carries the detail -->
    </aside>

    <main class="main-col" id="mainContent" tabindex="-1">
      <div id="app" class="route-view"></div>
    </main>
  </div>

  <footer>
    Local Journal — a private journal that stays on your device.<br>
    Built with <a href="https://pdf-lib.js.org" target="_blank" rel="noopener noreferrer">pdf-lib</a>, bundled locally.<br>
    <a href="privacy.html">Privacy</a> · <a href="https://edenapps.app/terms.html" target="_blank" rel="noopener noreferrer">Terms</a> · <a href="support.html">Help</a><br>
    <span class="footer-byline">An Eden Apps app · <a href="https://edenapps.app" target="_blank" rel="noopener noreferrer">edenapps.app</a></span>
  </footer>

  <!-- Toast slot. Not aria-hidden: the undo toast carries a real button that
       must stay reachable by keyboard and screen reader. -->
  <div class="toast-host" id="toastHost"></div>

  <!-- Persistent screen-reader live regions. announce() writes here so
       assistive tech hears status changes even though the visible status node
       is created and removed per view. -->
  <div id="srPolite" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="srAssertive" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <!-- pdf-lib is lazy-loaded on first PDF export (see ensurePdfLib in app.js) -->
  <script src="app.js?v=cb8e448e7d"></script>
</body>
</html>
